services:
  # WebLogic mode Standalone
  weblogic-standalone:
    image: gstvo2k15/weblogic:12.2.1.4-developer
    container_name: weblogic-standalone
    ports:
      - "7001:7001"
    environment:
      - ADMIN_NAME=AdminServer
      - ADMIN_PORT=7001
      - ADMIN_USERNAME=weblogic
      - ADMIN_PASSWORD=weblogic123
    volumes:
      - ./config:/u01/oracle/user_projects/domains/domain1/config
      - ./domain.properties:/u01/oracle/properties/domain.properties:ro

  # WebLogic Domain with multiple nodes
  weblogic-admin:
    image: gstvo2k15/weblogic:12.2.1.4-developer
    container_name: weblogic-admin
    ports:
      - "7002:7001"
    environment:
      - DOMAIN_NAME=domain1
      - ADMIN_NAME=AdminServer
      - ADMIN_PORT=7001
      - ADMIN_USERNAME=weblogic
      - ADMIN_PASSWORD=weblogic123
    volumes:
      - ./config:/u01/oracle/user_projects/domains/domain1/config
      - ./domain.properties:/u01/oracle/properties/domain.properties:ro

  weblogic-managed-1:
    image: gstvo2k15/weblogic:12.2.1.4-developer
    container_name: weblogic-managed-1
    environment:
      - DOMAIN_NAME=domain1
      - ADMIN_NAME=AdminServer
      - ADMIN_PORT=7001
      - ADMIN_USERNAME=weblogic
      - ADMIN_PASSWORD=weblogic123
    depends_on:
      - weblogic-admin
    volumes:
      - ./config:/u01/oracle/user_projects/domains/domain1/config
      - ./domain.properties:/u01/oracle/properties/domain.properties:ro

  weblogic-managed-2:
    image: gstvo2k15/weblogic:12.2.1.4-developer
    container_name: weblogic-managed-2
    environment:
      - DOMAIN_NAME=domain1
      - ADMIN_NAME=AdminServer
      - ADMIN_PORT=7001
      - ADMIN_USERNAME=weblogic
      - ADMIN_PASSWORD=weblogic123
    depends_on:
      - weblogic-admin
    volumes:
      - ./config:/u01/oracle/user_projects/domains/domain1/config
      - ./domain.properties:/u01/oracle/properties/domain.properties:ro

  # Nginx as Load Balancer
  nginx-load-balancer:
    image: bitnami/nginx:1.27
    container_name: nginx-weblogic-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - weblogic-managed-1
      - weblogic-managed-2
